[package]
name = "millracer"
version = "0.1.2"
edition = "2024"
description = "Pi-backed Millrace-aware operator harness and Rust parity port."
license = "Apache-2.0"
authors = ["Tim Osterhus"]
repository = "https://github.com/tim-osterhus/millracer-rs"
homepage = "https://millrace.ai"
readme = "README.md"
keywords = ["ai", "agents", "millrace", "operator"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.85"
include = [
    "/CHANGELOG.md",
    "/Cargo.lock",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/src/**/*.rs",
    "/tests/**/*.rs",
]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
libc = "0.2.177"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
